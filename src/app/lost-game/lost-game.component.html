<h3 class="text-3xl font-bold text-center">You lost</h3>
<p class="text-center">Wanna play again, set the grid:</p>
<div class="flex gap-4 justify-center mt-6">
  <h3 class="text-lg flex flex-col">
    Columns
    <input
      class="border rounded px-2 py-1"
      type="number"
      [value]="columnsForGrid"
      (input)="changeColumns($event)"
      min="2"
      max="5"
    />
  </h3>
  <h3 class="text-lg flex flex-col">
    Rows
    <input
      class="border rounded px-2 py-1"
      type="number"
      [value]="rowsForGrid"
      (input)="changeRows($event)"
      min="2"
      max="5"
    />
  </h3>
</div>
<button
  class="block mx-auto px-4 py-2 border-2 rounded-md mt-4"
  (click)="emitTogglePlayAgain()"
>
  Play again
</button>
