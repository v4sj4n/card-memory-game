<h3 class="text-3xl">Welcome to the card memory game</h3>
<p>The objective of the game is clicking an unclicked card each time until you click them all </p>
<small class="block">Depending on the grid size this can be challenging </small>
<button
    class=" mt-4 px-4 py-2 border-y-2 border-y-orange-400 hover:border-y-0 hover:border-x-2 hover:border-x-orange-600"
    (click)="emitToggleKnowTheGame()">Let's go</button>
